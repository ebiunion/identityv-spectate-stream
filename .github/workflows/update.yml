name: Update matches data

on:
  schedule:
    - cron: "0 3 * * *"   # 毎日 12:00 JST（UTC 03:00）
  workflow_dispatch:       # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch and parse
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/fetch_and_parse.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/matches.json
          git diff --staged --quiet || git commit -m "Update matches data $(date -u +%Y-%m-%d)"
          git push