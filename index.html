<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上位ハンター観戦チャンネル 試合検索</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CSMX80FEF5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-CSMX80FEF5');
</script>
<body>
  <div class="container">
    <h1>上位ハンター観戦チャンネル 試合検索</h1>
    <p class="updated" id="updatedAt">データ更新中...</p>

    <div class="filters">
      <div class="filter-group">
        <label>キャラクター</label>
        <select id="characterFilter">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <label>マップ</label>
        <select id="mapFilter">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <label>プレイヤー名</label>
        <input type="text" id="playerFilter" placeholder="部分一致">
      </div>
      <button id="resetBtn">リセット</button>
    </div>

    <div id="results"></div>
    <div id="loading" class="loading" style="display: none;">読み込み中...</div>
    <div id="noMore" class="no-more" style="display: none;">すべて表示しました</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
